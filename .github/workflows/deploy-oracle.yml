name: Deploy Oracle VPS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operacao segura na VPS
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy

permissions:
  contents: read

concurrency:
  group: pac-digital-oracle-production
  cancel-in-progress: false

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report runner network address
        run: printf 'runner_ip=%s\n' "$(curl -fsS https://api.ipify.org)"

      - name: Configure temporary SSH identity
        env:
          PAC_ORACLE_SSH_KEY: ${{ secrets.PAC_ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/pac-ssh"
          printf '%s\n' "$PAC_ORACLE_SSH_KEY" > "$RUNNER_TEMP/pac-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/pac-ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/pac-ssh/id_ed25519" | ssh-keygen -lf -

      - name: Inspect host without changes
        if: inputs.operation == 'inspect'
        run: |
          ssh -i "$RUNNER_TEMP/pac-ssh/id_ed25519" \
            -o BatchMode=yes -o ConnectTimeout=60 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            -o "ProxyCommand=ssh -i $RUNNER_TEMP/pac-ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=60 -o StrictHostKeyChecking=accept-new -W %h:%p -p 22 ocid1.bastionsession.oc1.sa-saopaulo-1.amaaaaaa7hw7x4aa2cvocfw5fq65miju6zhyxbblcjanq2loxxwgxdzxnnxq@host.bastion.sa-saopaulo-1.oci.oraclecloud.com" \
            ubuntu@10.0.0.75 \
            'set -eu; printf "host=%s\n" "$(hostname)"; printf "docker="; (docker --version || true); printf "compose="; (docker compose version || true); printf "git="; (git --version || true); printf "caddy="; (caddy version 2>/dev/null || true); printf "disk="; df -h / | tail -1; printf "pac_health="; (curl -fsS http://127.0.0.1:8080/health || true)'

      - name: Deploy PAC Digital on loopback port 8080
        if: inputs.operation == 'deploy'
        run: |
          ssh -i "$RUNNER_TEMP/pac-ssh/id_ed25519" \
            -o BatchMode=yes -o ConnectTimeout=60 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            -o "ProxyCommand=ssh -i $RUNNER_TEMP/pac-ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=60 -o StrictHostKeyChecking=accept-new -W %h:%p -p 22 ocid1.bastionsession.oc1.sa-saopaulo-1.amaaaaaa7hw7x4aa2cvocfw5fq65miju6zhyxbblcjanq2loxxwgxdzxnnxq@host.bastion.sa-saopaulo-1.oci.oraclecloud.com" \
            ubuntu@10.0.0.75 'bash -s' <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 git
            sudo systemctl enable --now docker
          fi

          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose-v2
          fi

          sudo install -d -o ubuntu -g ubuntu /opt/pac-digital-mprj
          if [ ! -d /opt/pac-digital-mprj/.git ]; then
            git clone https://github.com/M-4vlis/PAC-Digital-MPRJ.git /opt/pac-digital-mprj
          fi

          cd /opt/pac-digital-mprj
          git fetch --prune origin
          git checkout main
          git pull --ff-only origin main

          if [ ! -f .env ]; then
            umask 077
            {
              printf 'PAC_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)"
              printf 'PAC_HTTP_PORT=8080\n'
            } > .env
          fi

          sudo docker compose -f deploy/docker-compose.production.yml --env-file .env up -d --build --remove-orphans
          sudo docker compose -f deploy/docker-compose.production.yml --env-file .env ps

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              printf 'PAC Digital: healthy on 127.0.0.1:8080\n'
              exit 0
            fi
            sleep 2
          done

          printf 'Health check failed. Recent service status follows.\n' >&2
          sudo docker compose -f deploy/docker-compose.production.yml --env-file .env ps >&2
          exit 1
          REMOTE

      - name: Remove temporary SSH identity
        if: always()
        run: rm -rf "$RUNNER_TEMP/pac-ssh"
